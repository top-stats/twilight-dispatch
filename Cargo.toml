[package]
name = "twilight-dispatch"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[[bin]]
name = "twilight-dispatch"
path = "src/main.rs"

[dependencies]
bytes = { version = "1.10", default-features = false, features = ["std"] }
dotenvy = { version = "0.15.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = { version = "0.1.3", default-features = false }
hyper = { version = "1.6", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.16", default-features = false, features = ["tokio"] }
lapin = { version = "4.12", default-features = false, features = ["tokio"] }
prometheus = { version = "0.14", default-features = false, features = ["process"] }
redis = { version = "1.7", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
# twilight uses rustls without picking a crypto provider; main() installs ring.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "raw_value"] }
serde_repr = { version = "0.1", default-features = false }
time = { version = "0.3.41", default-features = false, features = ["std", "formatting", "parsing", "macros"] }
tokio = { version = "1.47", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["ansi", "fmt", "env-filter"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = { version = "0.17.1", default-features = false }

[profile.release]
lto = "thin"
panic = "abort"

[patch.crates-io]
twilight-gateway = { path = "vendor/twilight-gateway" }
twilight-model = { path = "vendor/twilight-model" }
