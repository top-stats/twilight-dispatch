version: 2
updates:
  # The actions in .github/workflows are pinned to commits; this keeps the
  # pins (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # vendor/twilight-model and vendor/twilight-gateway are patched copies
      # (see their PATCHES.md), and the other twilight crates must match them:
      # upgraded by hand.
      - dependency-name: 'twilight-*'
      # twilight-gateway connects through tokio-websockets and rustls 0.23.
      # main() installs the crypto provider into this crate's rustls, so it
      # must be the same release line as twilight's; the fake gateway in the
      # tests uses the same tokio-websockets.
      - dependency-name: rustls
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: tokio-websockets
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
