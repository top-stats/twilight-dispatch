name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; image builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # fmt, clippy, test and coverage run on GitHub-hosted runners so pull
  # requests (including ones from forks of this public repository) never
  # execute on the self-hosted runner. They are separate jobs so that one
  # failing check does not hide the result of the others.
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same toolchain as rust-toolchain.toml and the Docker image.
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Broken intra-doc links and other rustdoc warnings.
      - name: Docs
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      lavinmq:
        image: cloudamqp/lavinmq:2.10.1
        ports:
          - 5672:5672
          - 15672:15672

    env:
      CARGO_TERM_COLOR: always
      # Integration tests fail instead of skipping when a service is missing.
      REQUIRE_SERVICES: '1'
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      TEST_AMQP_HTTP: 127.0.0.1:15672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Same toolchain as rust-toolchain.toml and the Docker image.
      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Wait for Redis and LavinMQ
        run: |
          for port in 6379 5672 15672; do
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                break
              fi
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null || { echo "port $port is not reachable"; exit 1; }
          done

      - name: Test
        run: cargo test --locked --no-fail-fast

  # Line coverage of the service code (src/; not tests/ or vendor/), with the
  # lines no test runs listed in the log.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
      lavinmq:
        image: cloudamqp/lavinmq:2.10.1
        ports:
          - 5672:5672
          - 15672:15672

    env:
      CARGO_TERM_COLOR: always
      REQUIRE_SERVICES: '1'
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/%2f
      TEST_AMQP_HTTP: 127.0.0.1:15672
      IGNORE_FILES: '/(vendor|tests)/'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.98.1 --profile minimal --component llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Wait for Redis and LavinMQ
        run: |
          for port in 6379 5672 15672; do
            for _ in $(seq 1 60); do
              if (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                break
              fi
              sleep 1
            done
            (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null || { echo "port $port is not reachable"; exit 1; }
          done

      - name: Test with coverage
        run: cargo llvm-cov --no-report --locked --no-fail-fast

      - name: Coverage report
        if: ${{ !cancelled() }}
        run: |
          cargo llvm-cov report --ignore-filename-regex "$IGNORE_FILES" --lcov --output-path lcov.info
          cargo llvm-cov report --ignore-filename-regex "$IGNORE_FILES" --summary-only | tee summary.txt
          { echo '```'; cat summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "Lines no test runs:"
          awk -F'[:,]' '
            function flush() {
              if (start >= 0) out = out " " (start == prev ? start : start "-" prev)
              start = prev = -1
            }
            /^SF:/ { file = substr($0, 4); sub(/.*\/src\//, "src/", file); out = ""; start = prev = -1 }
            /^DA:/ && $3 == 0 {
              line = $2 + 0
              if (line == prev + 1) { prev = line } else { flush(); start = prev = line }
            }
            /^end_of_record/ { flush(); if (out != "") print file ":" out }
          ' lcov.info | sort

      - name: Upload lcov.info
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  build-and-push:
    needs: [fmt, clippy, test]
    # Only pushes publish an image; pull requests stop after the tests.
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
